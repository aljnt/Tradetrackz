server:
  port: 8080

spring:
  application:
    name: tradingapp-backend

  datasource:
    url: jdbc:h2:mem:tradingapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Config PostgreSQL (production) :
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/tradingapp
  #   username: postgres
  #   password: password
  #   driver-class-name: org.postgresql.Driver

